name: Bug report
description: Something does not work as documented.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The package version (and the PI WEB and pi versions, for a PI WEB plugin or pi extension).
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, install method, browser and device where relevant.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove tokens, private paths and anything else you would not publish.
